spring.application.name=MM Backend
server.port=${SERVER_PORT:8000}

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/clients?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.sql.init.mode=never

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

mm.device-api-key=${DEVICE_API_KEY:}
mm.error-api-key=${ERROR_API_KEY:}
mm.ws-device-auth-token=${WS_DEVICE_AUTH_TOKEN:}
mm.ws-url=${WS_URL:wss://yourdomain.com/api/ws/}
mm.error-log-dir=${ERROR_LOG_DIR:runtime/error_logs}
mm.app-base-path=${APP_BASE_PATH:../.legacy-runtime}
# Enables the APK builder hook. When enabled with no command template, the backend
# launches APP_BASE_PATH/private/EaodStarter with the legacy base64 argument list.
mm.builder.enabled=${BUILDER_ENABLED:true}
# Optional shell template for controlled deployments/tests. Receives APP_DIR, APK_PATH,
# APP_ID, APP_NAME, APP_VERSION, USER_ID, and USER_EMAIL in the environment.
mm.builder.command-template=${BUILDER_COMMAND_TEMPLATE:}
mm.geoip-db-path=${GEOIP_DB_PATH:}
mm.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:}
mm.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# Internal-only token for /api/internal_reassign.php — MUST be different from any token
# distributed to device clients (WS_DEVICE_AUTH_TOKEN / DEVICE_API_KEY). Blank disables
# the endpoint.
mm.internal-api-token=${INTERNAL_API_TOKEN:}
# Comma-separated list of trusted reverse-proxy IPs. Only X-Forwarded-For values arriving
# from these source IPs are trusted; everything else uses the raw socket address.
mm.trusted-proxies=${TRUSTED_PROXIES:}
# Comma-separated list of allowed WS origins. Empty = allow any origin (do not use in prod).
mm.ws-allowed-origins=${WS_ALLOWED_ORIGINS:}
# DEPRECATED: Permission model now uses role-based access control (RBAC) in PanelWebSocketHandler.
# Admin users can execute: join, out, ping, disag, checkphone, reassign
# Regular users can execute: join, out, ping, disag, checkphone
# Device connections can execute device-specific commands only.
# Old WS_BLOCKED_ADMIN_SUBCOMMANDS is no longer used and can be safely removed.
# mm.ws-blocked-subcommands=${WS_BLOCKED_ADMIN_SUBCOMMANDS:}

# Admin console pre-shared access key (first of the two-factor gate). When blank, the
# X-Admin-Gate header is not enforced — only suitable for local dev. In prod, set a
# long random value and rotate periodically.
mm.admin-panel.access-key=${ADMIN_PANEL_ACCESS_KEY:}
mm.admin-panel.gate-ttl-seconds=${ADMIN_PANEL_GATE_TTL:300}
